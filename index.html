    .btn-red { background: #f44336; color: #fff; }
    input[type="file"] { display: none; }

    #catalog-bar {

      overflow-x: auto; 
      padding: 6px 10px; 
      background: #252525; 
      z-index: 9; 
      align-items: center;
      scrollbar-width: thin;

    .catalog-item {

    .catalog-item img {

    .catalog-item span {

    #canvas-container {

      flex-grow: 1; 
      background: #181818; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      overflow: hidden;
    }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }

    #placeholder { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); color: #aaa; text-align: center; pointer-events: none; width: 85%; }
    #placeholder .icon { font-size: 40px; margin-bottom: 8px; display: block; }

  <div id="canvas-container">
    <div id="placeholder">
      <span class="icon">🏠</span>
      <p><b>سامانه پرو مجازی فرش</b></p>
      <p style="font-size: 11px; margin-top: 6px; color: #888;">
        ۱. عکس اتاق را بارگذاری کنید.<br>
        ۲. فرش موردنظر را انتخاب کنید.
      </p>
    </div>
    <canvas id="mainCanvas"></canvas>
  </div>

<script>
  const tg = window.Telegram?.WebApp;
  if(tg) tg.expand();

  const canvas = document.getElementById('mainCanvas');
  const ctx = canvas.getContext('2d');
  const placeholder = document.getElementById('placeholder');
  const container = document.getElementById('canvas-container');

  let roomImg = null;
  let carpets = [];
  let activeCarpetIdx = -1;
  let activePtIdx = -1;
  let imgBounds = { x: 0, y: 0, width: 0, height: 0, scale: 1 };

  function updateCanvasDimensions() {
    canvas.width = container.clientWidth;
    canvas.height = container.clientHeight;
    calculateAspectFit();
    draw();
  }
  
  window.addEventListener('resize', updateCanvasDimensions);
  setTimeout(updateCanvasDimensions, 100);

  function calculateAspectFit() {
    if (!roomImg) return;
    const canvasRatio = canvas.width / canvas.height;
    const imgRatio = roomImg.width / roomImg.height;

    if (imgRatio > canvasRatio) {
      imgBounds.width = canvas.width;
      imgBounds.height = canvas.width / imgRatio;
      imgBounds.x = 0;
      imgBounds.y = (canvas.height - imgBounds.height) / 2;
    } else {
      imgBounds.height = canvas.height;
      imgBounds.width = canvas.height * imgRatio;
      imgBounds.y = 0;
      imgBounds.x = (canvas.width - imgBounds.width) / 2;
    }
    imgBounds.scale = imgBounds.width / roomImg.width;
  }

  function handleRoomImage(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      roomImg = new Image();
      roomImg.onload = () => {
        placeholder.style.display = 'none';
        carpets = [];
        updateCanvasDimensions();
      };
      roomImg.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  document.getElementById('roomGalleryInput').addEventListener('change', (e) => handleRoomImage(e.target.files[0]));
  document.getElementById('roomCameraInput').addEventListener('change', (e) => handleRoomImage(e.target.files[0]));

  function createFallbackCarpetImage(label) {
    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = 300;
    tempCanvas.height = 400;
    const tCtx = tempCanvas.getContext('2d');
    
    tCtx.fillStyle = '#8c2626';
    tCtx.fillRect(0, 0, 300, 400);
    
    tCtx.strokeStyle = '#d4af37';
    tCtx.lineWidth = 10;
    tCtx.strokeRect(15, 15, 270, 370);
    
    tCtx.fillStyle = '#ffffff';
    tCtx.font = 'bold 24px Tahoma';
    tCtx.textAlign = 'center';
    tCtx.fillText('طرح فرش', 150, 180);
    tCtx.fillText(label, 150, 220);
    
    const img = new Image();
    img.src = tempCanvas.toDataURL();
    return img;
  }

  function addCarpetFromUrl(url, label) {
    if (!roomImg) {
      alert("لطفاً ابتدا تصویر اتاق را بارگذاری کنید.");
      return;
    }
    const img = new Image();
    img.crossOrigin = "anonymous";

    const loadCarpetToCanvas = (carpetImg) => {
      const { x, y, width: w, height: h } = imgBounds;
      const offset = carpets.length * 15;

      const newCarpet = {
        img: carpetImg,
        pts: [
          { x: x + w * 0.3 + offset, y: y + h * 0.5 + offset },
          { x: x + w * 0.7 + offset, y: y + h * 0.5 + offset },
          { x: x + w * 0.8 + offset, y: y + h * 0.8 + offset },
          { x: x + w * 0.2 + offset, y: y + h * 0.8 + offset }
        ]
      };
      carpets.push(newCarpet);
      activeCarpetIdx = carpets.length - 1;
      draw();
    };

    img.onload = () => loadCarpetToCanvas(img);
    img.onerror = () => {
      // در صورت نرسیدن یا نیافتن فایل عکس، یک طرح پیش‌فرض نمایش داده می‌شود
      const fallbackImg = createFallbackCarpetImage(label);
      fallbackImg.onload = () => loadCarpetToCanvas(fallbackImg);
    };

    img.src = url;
  }

  document.getElementById('removeBtn').addEventListener('click', () => {
    if (carpets.length === 0) return;
    if (activeCarpetIdx !== -1 && activeCarpetIdx < carpets.length) {
      carpets.splice(activeCarpetIdx, 1);
    } else {
      carpets.pop();
    }
    activeCarpetIdx = carpets.length - 1;
    draw();
  });

  function drawPerspectiveOnCtx(targetCtx, carpet) {
    const steps = 15;
    const { img, pts } = carpet;

    for (let i = 0; i < steps; i++) {
      for (let j = 0; j < steps; j++) {
        let u1 = i / steps, v1 = j / steps;
        let u2 = (i + 1) / steps, v2 = (j + 1) / steps;

        let p1 = getPoint(pts, u1, v1);
        let p2 = getPoint(pts, u2, v1);
        let p3 = getPoint(pts, u2, v2);
        let p4 = getPoint(pts, u1, v2);

        targetCtx.save();
        targetCtx.beginPath();
        targetCtx.moveTo(p1.x, p1.y);
        targetCtx.lineTo(p2.x, p2.y);
        targetCtx.lineTo(p3.x, p3.y);
        targetCtx.lineTo(p4.x, p4.y);
        targetCtx.closePath();
        targetCtx.clip();

        let sx = u1 * img.width;
        let sy = v1 * img.height;
        let sw = (u2 - u1) * img.width;
        let sh = (v2 - v1) * img.height;

        drawTriangleOnCtx(targetCtx, img, p1, p2, p3, {x: sx, y: sy}, {x: sx + sw, y: sy}, {x: sx + sw, y: sy + sh});
        drawTriangleOnCtx(targetCtx, img, p1, p3, p4, {x: sx, y: sy}, {x: sx + sw, y: sy + sh}, {x: sx, y: sy + sh});
        targetCtx.restore();
      }
    }
  }

  function getPoint(pts, u, v) {
    let topX = pts[0].x + u * (pts[1].x - pts[0].x);
    let topY = pts[0].y + u * (pts[1].y - pts[0].y);
    let botX = pts[3].x + u * (pts[2].x - pts[3].x);
    let botY = pts[3].y + u * (pts[2].y - pts[3].y);

    return { x: topX + v * (botX - topX), y: topY + v * (botY - topY) };
  }

  function drawTriangleOnCtx(targetCtx, img, p0, p1, p2, t0, t1, t2) {
    let delta = t0.x * (t1.y - t2.y) + t1.x * (t2.y - t0.y) + t2.x * (t0.y - t1.y);
    if (Math.abs(delta) < 0.001) return;

    let deltaA = p0.x * (t1.y - t2.y) + p1.x * (t2.y - t0.y) + p2.x * (t0.y - t1.y);
    let deltaB = t0.x * (p1.x - p2.x) + t1.x * (p2.x - p0.x) + t2.x * (p0.x - p1.x);
    let deltaC = t0.x * (t1.y * p2.x - t2.y * p1.x) + t1.x * (t2.y * p0.x - t0.y * p2.x) + t2.x * (p0.x * t1.y - t1.x * p0.y);

    let deltaD = p0.y * (t1.y - t2.y) + p1.y * (t2.y - t0.y) + p2.y * (t0.y - t1.y);
    let deltaE = t0.x * (p1.y - p2.y) + t1.x * (p2.y - p0.y) + t2.x * (p0.y - p1.y);
    let deltaF = t0.x * (t1.y * p2.y - t2.y * p1.y) + t1.x * (t2.y * p0.y - t0.y * p2.y) + t2.x * (p0.y * t1.y - t1.y * p0.y);

    targetCtx.transform(deltaA / delta, deltaD / delta, deltaB / delta, deltaE / delta, deltaC / delta, deltaF / delta);
    targetCtx.drawImage(img, 0, 0);
  }

  function draw(hideHandles = false) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (roomImg) {
      ctx.drawImage(roomImg, imgBounds.x, imgBounds.y, imgBounds.width, imgBounds.height);
    }

    carpets.forEach((carpet, cIdx) => {
      drawPerspectiveOnCtx(ctx, carpet);

      if (!hideHandles) {
        ctx.strokeStyle = cIdx === activeCarpetIdx ? '#ff0055' : '#00e5ff';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(carpet.pts[0].x, carpet.pts[0].y);
        carpet.pts.forEach(p => ctx.lineTo(p.x, p.y));
        ctx.closePath();
        ctx.stroke();

        carpet.pts.forEach(p => {
          ctx.fillStyle = cIdx === activeCarpetIdx ? '#ff0055' : '#00e5ff';
          ctx.beginPath();
          ctx.arc(p.x, p.y, Math.max(8, canvas.width * 0.012), 0, Math.PI * 2);
          ctx.fill();
        });
      }
    });
  }

  function getCanvasPos(e) {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return {
      x: (clientX - rect.left) * (canvas.width / rect.width),
      y: (clientY - rect.top) * (canvas.height / rect.height)
    };
  }

  function startDrag(e) {
    const pos = getCanvasPos(e);
    const radius = 30;

    activePtIdx = -1;

    for (let c = carpets.length - 1; c >= 0; c--) {
      let pIdx = carpets[c].pts.findIndex(p => Math.hypot(p.x - pos.x, p.y - pos.y) < radius);
      if (pIdx !== -1) {
        activeCarpetIdx = c;
        activePtIdx = pIdx;
        break;
      }
    }
    draw();
  }

  function moveDrag(e) {
    if (activeCarpetIdx === -1 || activePtIdx === -1) return;
    const pos = getCanvasPos(e);
    carpets[activeCarpetIdx].pts[activePtIdx] = pos;
    draw();
  }

  function stopDrag() { activePtIdx = -1; }

  canvas.addEventListener('mousedown', startDrag);
  canvas.addEventListener('mousemove', moveDrag);
  canvas.addEventListener('mouseup', stopDrag);

  canvas.addEventListener('touchstart', startDrag);
  canvas.addEventListener('touchmove', moveDrag);
  canvas.addEventListener('touchend', stopDrag);

  document.getElementById('downloadBtn').addEventListener('click', () => {
    if (!roomImg) return alert("لطفاً ابتدا عکس اتاق را وارد کنید.");
    
    const exportCanvas = document.createElement('canvas');
    exportCanvas.width = roomImg.width;
    exportCanvas.height = roomImg.height;
    const exportCtx = exportCanvas.getContext('2d');

    exportCtx.drawImage(roomImg, 0, 0);

    const scale = roomImg.width / imgBounds.width;

    carpets.forEach(carpet => {
      const scaledPts = carpet.pts.map(p => ({
        x: (p.x - imgBounds.x) * scale,
        y: (p.y - imgBounds.y) * scale
      }));

      drawPerspectiveOnCtx(exportCtx, { img: carpet.img, pts: scaledPts });
    });

    const link = document.createElement('a');
    link.download = 'carpet-pro.jpg';
    link.href = exportCanvas.toDataURL('image/jpeg', 0.95);
    link.click();
  });
</script>
